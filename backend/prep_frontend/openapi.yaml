openapi: 3.0.3
info:
  title: TEL-U Shop API (Backend Source)
  version: 1.0.0
servers:
  - url: http://localhost/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    ResponseEnvelope:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          nullable: true
        data:
          nullable: true
        errors:
          nullable: true
      additionalProperties: true
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
        data:
          type: array
          items:
            type: object
        links:
          type: array
          items:
            type: object
      additionalProperties: true
    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          nullable: true
        data:
          $ref: '#/components/schemas/Pagination'
        errors:
          nullable: true
      additionalProperties: true
paths:
  /register:
    post:
      summary: Register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                username: { type: string }
                email: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
                nim: { type: string }
                kelas: { type: string }
                phone: { type: string }
                role: { type: integer }
              required: [name, username, email, password, password_confirmation, nim, kelas, phone, role]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
  /login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
  /me:
    get:
      summary: Current user
      tags: [Auth]
      security:
